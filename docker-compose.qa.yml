version: "3.9"
services:
  rasa:
    # build: .
    image: rasa/rasa:3.12.20
    ports:
      - "5005:5005"
    volumes:
      - ./:/app
    command:
      - run
      - --enable-api
      - --cors
      - "*"
      - --debug
    environment:
      - RASA_ENV=qa
  actions:
    image: rasa/rasa-sdk:3.12.1
    volumes:
      - ./actions:/app/actions
    ports:
      - "5055:5055"
    command:
      - start
      - --actions
      - actions